# Docker Compose mode. The app is scraped on the compose network; the orchestrator runs on the host.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: app
    static_configs:
      - targets: ["app:8080"]
  - job_name: orchestrator
    static_configs:
      - targets: ["host.docker.internal:9100"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
