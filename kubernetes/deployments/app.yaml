apiVersion: apps/v1
kind: Deployment
metadata:
  name: shl-app
  namespace: shl
  labels: {app: shl-app}
spec:
  replicas: 2
  revisionHistoryLimit: 5            # needed for `kubectl rollout undo` remediation
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: shl-app}
  template:
    metadata:
      labels: {app: shl-app}
    spec:
      containers:
        - name: app
          image: shl-app:latest
          imagePullPolicy: IfNotPresent   # image is loaded into Kind with `kind load docker-image`
          ports: [{containerPort: 8080}]
          env:
            - {name: ENABLE_CHAOS, value: "true"}
            - {name: APP_MEMORY_LIMIT_MB, value: "192"}
            - {name: APP_CPU_LIMIT, value: "0.5"}
            - {name: MAX_CHAOS_MB, value: "160"}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 192Mi}
          readinessProbe:
            httpGet: {path: /ready, port: 8080}
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:                  # deliberately slow (60s) so the orchestrator acts first
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
