# Sample app + Prometheus + Grafana. The orchestrator runs on the host (needs the docker CLI):
#   make run      (see README). restart is "no" on purpose: the orchestrator is the healer.
services:
  app:
    build: .
    image: shl-app:latest
    container_name: shl-app
    ports: ["8081:8080"]
    environment:
      ENABLE_CHAOS: "true"
      APP_MEMORY_LIMIT_MB: "192"
      APP_CPU_LIMIT: "0.5"
      MAX_CHAOS_MB: "160"
    mem_limit: 192m
    cpus: 0.5
    restart: "no"

  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: shl-prometheus
    ports: ["9090:9090"]
    volumes:
      - ${PROMETHEUS_CONFIG:-./monitoring/prometheus/prometheus.yml}:/etc/prometheus/prometheus.yml:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    mem_limit: 256m

  grafana:
    image: grafana/grafana:11.1.3
    container_name: shl-grafana
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    mem_limit: 256m
